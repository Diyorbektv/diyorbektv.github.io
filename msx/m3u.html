<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script>
window.addEventListener("message", function(event) {
    var data = event.data;
    if (typeof data === "string") {
        try { data = JSON.parse(data); } catch (e) { return; }
    }
    if (data && data.type === "init") {
        var params = new URLSearchParams(window.location.search);
        var m3uUrl = params.get("url");
        if (!m3uUrl) {
            window.parent.postMessage(JSON.stringify({
                type: "response",
                id: data.id,
                status: 400,
                message: "URL topilmadi"
            }), "*");
            return;
        }
        fetch(m3uUrl)
            .then(function(r) { return r.text(); })
            .then(function(text) {
                var items = [];
                var lines = text.split("\n");
                var title = "";
                for (var i = 0; i < lines.length; i++) {
                    var line = lines[i].trim();
                    if (line.indexOf("#EXTINF:") === 0) {
                        var comma = line.lastIndexOf(",");
                        title = comma !== -1 ? line.substring(comma + 1).trim() : "Channel";
                    } else if (line.length > 0 && line.indexOf("#") !== 0) {
                        items.push({
                            title: title || "Channel",
                            action: "video:" + line
                        });
                        title = "";
                    }
                }
                window.parent.postMessage(JSON.stringify({
                    type: "response",
                    id: data.id,
                    status: 200,
                    data: {
                        type: "list",
                        template: {
                            type: "separate",
                            layout: "0,0,4,1",
                            color: "msx-glass"
                        },
                        items: items
                    }
                }), "*");
            })
            .catch(function(err) {
                window.parent.postMessage(JSON.stringify({
                    type: "response",
                    id: data.id,
                    status: 500,
                    message: "Yuklashda xato: " + err
                }), "*");
            });
    }
});
</script>
</head>
<body></body>
</html>
