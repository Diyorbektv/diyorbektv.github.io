<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://benzac.de"></script>
<script>
function M3UHandler() {
    var baseUrl = null;
    this.init = function() {
        var query = window.location.search.substring(1);
        var vars = query.split("&");
        for (var i = 0; i < vars.length; i++) {
            var pair = vars[i].split("=");
            if (pair[0] == "url") {
                baseUrl = decodeURIComponent(pair[1]);
            }
        }
    };
    this.handleData = function(data) {
        if (baseUrl != null) {
            TVXServices.ajax.get(baseUrl, {
                success: function(response) {
                    var items = [];
                    var lines = response.split("\n");
                    var title = "";
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (line.indexOf("#EXTINF:") === 0) {
                            var comma = line.lastIndexOf(",");
                            title = comma !== -1 ? line.substring(comma + 1).trim() : "Channel";
                        } else if (line.length > 0 && line.indexOf("#") !== 0) {
                            items.push({
                                title: title || "Channel",
                                action: "video:" + line
                            });
                            title = "";
                        }
                    }
                    data.response({
                        status: 200,
                        data: {
                            type: "list",
                            template: {
                                type: "separate",
                                layout: "0,0,4,1",
                                color: "msx-glass"
                            },
                            items: items
                        }
                    });
                },
                error: function(error) {
                    data.error("M3U yuklanmadi: " + error);
                }
            });
        } else {
            data.error("URL topilmadi");
        }
    };
}
TVXPluginTools.onReady(function() {
    TVXInteractionPlugin.setupHandler(new M3UHandler());
    TVXInteractionPlugin.init();
});
</script>
</head>
<body></body>
</html>
